{% extends "base.html" %}

{% block title %}Add Food | Foodie{% endblock %}

{% block content %}
<section class="section narrow">
    <div class="section-header">
        <h1>Add Food Item</h1>
        <a class="secondary-btn" href="{% url 'admin_manage_food' %}">Manage Food</a>
    </div>

    <form class="form-card" method="post">
        {% csrf_token %}
        <label>Food Name
            <input type="text" name="name" placeholder="Enter food name" required>
        </label>
        <label>Price
            <input type="number" step="0.01" min="0" name="price" placeholder="Enter price" required>
        </label>
        <label>Category
            <select name="category">
                {% for value,label in categories %}
                    <option value="{{ value }}">{{ label }}</option>
                {% endfor %}
            </select>
        </label>
        <label>Image URL
            <input type="url" name="image_url" placeholder="Paste image link">
        </label>
        <label>Description
            <textarea name="description" placeholder="Food description"></textarea>
        </label>
        <label class="check-row">
            <input type="checkbox" name="is_available" checked>
            Available on menu
        </label>
        <button class="primary-btn" type="submit">Add Food</button>
    </form>
</section>
{% endblock %}
